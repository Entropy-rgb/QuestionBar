<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>QuestionBar</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="vendor/texmath.css">
  <link rel="stylesheet" href="vendor/hljs/github-dark.min.css" id="hljs-theme">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="grip" title="Drag to resize"></div>

  <header>
    <div class="row">
      <div class="field">
        <input id="new" type="text" placeholder="New question…  #topic #tags" autocomplete="off" spellcheck="true">
      </div>
      <button id="use-sel" class="icon-btn" title="Use selection: quote the text you highlighted (Ctrl+Shift+V)">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 17h4l2-4V7H4v6h3zm10 0h4l2-4V7h-6v6h3z" fill="currentColor"/></svg>
      </button>
      <button id="pin" class="icon-btn" title="Pin: stay open when clicking elsewhere" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 3l6 6-3 1-4 4 1 5-2 2-4-4-5 5-1-1 5-5-4-4 2-2 5 1 4-4z" fill="currentColor"/></svg>
      </button>
      <button id="settings-btn" class="icon-btn" title="Settings" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zm7.4-2.5.1-1-.1-1 2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.5 11l-.1 1 .1 1-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div id="capture" class="capture" hidden>
      <blockquote id="capture-text"></blockquote>
      <button id="capture-clear" class="icon-btn small" title="Discard quote">
        <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="row">
      <div class="field">
        <input id="search" type="search" placeholder="Search   (#tag filters)" autocomplete="off" spellcheck="false">
      </div>
    </div>
    <div id="update" class="update" role="status" hidden></div>
    <div class="row filters" role="tablist">
      <button class="seg" data-filter="all" aria-selected="true">All <span id="count-all"></span></button>
      <button class="seg" data-filter="open" aria-selected="false">Open <span id="count-open"></span></button>
      <button class="seg" data-filter="answered" aria-selected="false">Answered <span id="count-answered"></span></button>
      <span class="grow"></span>
      <button id="back" class="seg back" title="Back to where you were (Alt+Left)" hidden>← Back</button>
      <button id="compact" class="seg icon-seg" title="Compact view: one line per question" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main id="list" tabindex="-1"></main>
  <section id="settings" tabindex="-1" hidden></section>
  <div id="peek" hidden></div>
  <div id="toast" role="status" hidden></div>

  <script src="vendor/markdown-it.umd.min.js"></script>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="vendor/texmath.js"></script>
  <script src="vendor/hljs/highlight.min.js"></script>
  <script src="vendor/hljs/extra-languages.min.js"></script>
  <script src="markdown-ext.js"></script>
  <script src="latex-commands.js"></script>
  <script src="editor-tools.js"></script>
  <script src="app.js"></script>
  <script src="settings.js"></script>
</body>
</html>
