[package]
name = "questionbar"
version = "0.1.0"
description = "A hotkey side panel for the questions you have while learning"
license = "MIT"
repository = "https://github.com/Entropy-rgb/QuestionBar"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
notify = "8"
dirs = "7"
semver = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# Same version Tauri uses; for reading the highlighted-text ("primary") selection.
gtk = "0.18"
# For asking the window manager to focus the panel (see panel::activate).
raw-window-handle = "0.6"
x11rb = "0.13"
# Asks GitHub for the latest release (the .deb can't update itself).
ureq = "3"

[target.'cfg(windows)'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
arboard = "3"

[profile.release]
strip = true
lto = true
