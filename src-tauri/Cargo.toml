[package]
name = "questionbar"
version = "0.1.0"
description = "A hotkey side panel for the questions you have while learning"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
notify = "8"

[target.'cfg(target_os = "linux")'.dependencies]
# Same version Tauri uses; for reading the highlighted-text ("primary") selection.
gtk = "0.18"

[profile.release]
strip = true
lto = true
