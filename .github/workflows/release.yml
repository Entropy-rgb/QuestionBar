# Builds QuestionBar for Linux (.deb) and Windows (setup .exe) and publishes one GitHub
# release with both. Start it from the Actions tab: "Release" -> "Run workflow".
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.2.0. Leave empty to bump the last release (0.1.0 -> 0.1.1)."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags, to find the last release

      - name: Pick the version
        id: pick
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version="${REQUESTED#v}"
          if [ -z "$version" ]; then
            last=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
            if [ -n "$last" ]; then
              IFS=. read -r major minor patch <<< "${last#v}"
              version="$major.$minor.$((patch + 1))"
            else
              version=$(jq -r .version src-tauri/tauri.conf.json)
            fi
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$version' is not a version like 1.2.3"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version has already been released"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"

  build:
    needs: version
    strategy:
      matrix:
        include:
          # The oldest supported Ubuntu, so the .deb installs on as many systems as possible.
          - os: ubuntu-22.04
            bundle: deb
          - os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run the tests
        if: runner.os == 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # The version only lives in this build; nothing is committed back.
      - name: Put the version into the build
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tauri.conf.json.tmp
          mv tauri.conf.json.tmp src-tauri/tauri.conf.json
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Build the .deb
        if: runner.os == 'Linux'
        run: npx --yes @tauri-apps/cli@2 build --bundles deb

      # Also signs the installer so installed copies can update themselves.
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.bundle }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The Windows updater reads this file from the latest release.
      - name: Write latest.json
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          exe=$(ls dist/*-setup.exe)
          jq -n \
            --arg version "$VERSION" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat "$exe.sig")" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$(basename "$exe")" \
            '{version: $version, pub_date: $date, notes: "See the release page for what changed.",
              platforms: {"windows-x86_64": {signature: $signature, url: $url}}}' > dist/latest.json
          cat dist/latest.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "QuestionBar $VERSION" \
            --generate-notes \
            dist/*.deb dist/*-setup.exe dist/latest.json
