# Builds QuestionBar and publishes a GitHub release with a .deb package.
# Start it from the Actions tab: "Release" -> "Run workflow".
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.2.0. Leave empty to bump the last release (0.1.0 -> 0.1.1)."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    # The oldest supported Ubuntu, so the .deb installs on as many systems as possible.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags, to find the last release

      - name: Pick the version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version="${REQUESTED#v}"
          if [ -z "$version" ]; then
            last=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
            if [ -n "$last" ]; then
              IFS=. read -r major minor patch <<< "${last#v}"
              version="$major.$minor.$((patch + 1))"
            else
              version=$(jq -r .version src-tauri/tauri.conf.json)
            fi
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$version' is not a version like 1.2.3"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version has already been released"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run the tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # The version only lives in this build; nothing is committed back.
      - name: Put the version into the build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tauri.conf.json.tmp
          mv tauri.conf.json.tmp src-tauri/tauri.conf.json
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Build the .deb
        run: npx --yes @tauri-apps/cli@2 build --bundles deb

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "QuestionBar $VERSION" \
            --generate-notes \
            src-tauri/target/release/bundle/deb/*.deb
